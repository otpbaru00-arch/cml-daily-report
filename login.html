<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk - Daily Report</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#102033;--muted:#6b7785;--line:#dce5ee;--accent:#1677ff;--danger:#b42318;--ok:#067647}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,#d9ebff 0,transparent 34%),linear-gradient(135deg,#f8fbff,#eef4f9);color:var(--ink);display:grid;place-items:center;padding:24px}.wrap{width:min(440px,100%)}.brand{text-align:center;margin-bottom:18px}.logo{width:58px;height:58px;border-radius:17px;background:#102033;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:28px;box-shadow:0 14px 35px rgba(16,32,51,.18)}h1{font-size:25px;margin:0 0 6px}.brand p{margin:0;color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid rgba(20,45,70,.1);border-radius:20px;box-shadow:0 22px 55px rgba(20,45,70,.12);padding:24px}.step{display:none}.step.active{display:block}.field{margin-bottom:15px}label{display:block;font-weight:800;font-size:12px;margin-bottom:7px}input{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;padding:0 13px;font-size:15px;outline:none;background:#fff}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,119,255,.12)}.otp{font-size:24px;letter-spacing:8px;text-align:center;font-weight:900;padding-left:20px}.btn{width:100%;height:46px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#eef4fb;color:#16304c;margin-top:9px}.msg{display:none;margin:13px 0 0;padding:10px 11px;border-radius:10px;font-size:12px;font-weight:700;line-height:1.45}.msg.show{display:block}.msg.error{background:#fff1f0;color:var(--danger)}.msg.ok{background:#ecfdf3;color:var(--ok)}.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px}.sender{font-weight:850;color:#263d58}.email-view{background:#f5f8fc;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:800;font-size:13px;margin-bottom:15px;word-break:break-all}.footer{text-align:center;color:#8290a0;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">📊</div><h1>DAILY REPORT</h1><p>Daftar atau masuk menggunakan verifikasi OTP email.</p></div>
  <div class="card">
    <section id="emailStep" class="step active">
      <div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="nama@email.com"></div>
      <button class="btn" id="sendBtn">Kirim OTP</button>
      <div class="hint">Kode OTP 6 digit akan dikirim ke email Anda dari <span class="sender">mariohebat7@gmail.com</span>. OTP berlaku 10 menit.</div>
    </section>
    <section id="otpStep" class="step">
      <div class="email-view" id="emailView"></div>
      <div class="field"><label>KODE OTP</label><input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
      <button class="btn" id="verifyBtn">Verifikasi & Masuk</button>
      <button class="btn secondary" id="backBtn">Ganti Email</button>
      <div class="hint">Tidak menerima kode? Anda dapat meminta OTP baru setelah jeda pengiriman berakhir.</div>
    </section>
    <div id="msg" class="msg"></div>
  </div>
  <div class="footer">Akses report dilindungi verifikasi email.</div>
</div>
<script>
const $=id=>document.getElementById(id);let activeEmail='';
function showMsg(text,type='error'){const m=$('msg');m.textContent=text;m.className='msg show '+type}
function clearMsg(){$('msg').className='msg';$('msg').textContent=''}
function busy(btn,on,text){btn.disabled=on;if(on){btn.dataset.old=btn.textContent;btn.textContent=text}else if(btn.dataset.old)btn.textContent=btn.dataset.old}
async function jsonFetch(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...options});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||'Terjadi kesalahan.');return d}
async function check(){try{const d=await jsonFetch('/api/auth/session');if(d.authenticated)location.replace('/')}catch(_){}}
$('sendBtn').onclick=async()=>{clearMsg();const email=$('email').value.trim().toLowerCase();if(!email){showMsg('Masukkan email terlebih dahulu.');return}busy($('sendBtn'),true,'Mengirim...');try{const d=await jsonFetch('/api/auth/request-otp',{method:'POST',body:JSON.stringify({email})});activeEmail=email;$('emailView').textContent=email;$('emailStep').classList.remove('active');$('otpStep').classList.add('active');$('otp').focus();showMsg(d.message||'OTP sudah dikirim.','ok')}catch(e){showMsg(e.message)}finally{busy($('sendBtn'),false)}};
$('verifyBtn').onclick=async()=>{clearMsg();const otp=$('otp').value.replace(/\D/g,'');if(otp.length!==6){showMsg('OTP harus terdiri dari 6 digit.');return}busy($('verifyBtn'),true,'Memverifikasi...');try{await jsonFetch('/api/auth/verify-otp',{method:'POST',body:JSON.stringify({email:activeEmail,otp})});location.replace('/')}catch(e){showMsg(e.message)}finally{busy($('verifyBtn'),false)}};
$('backBtn').onclick=()=>{clearMsg();$('otp').value='';$('otpStep').classList.remove('active');$('emailStep').classList.add('active');$('email').focus()};
$('otp').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6));
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendBtn').click()});$('otp').addEventListener('keydown',e=>{if(e.key==='Enter')$('verifyBtn').click()});
check();
</script>
</body></html>
